<!DOCTYPE html>

<!-- بعد npm run ui و npm run serve: http://localhost:5173/poster.html (وعلى الموقع: /poster.html، وملصقا اللعبة في /poster.html#game)
     البطاقة المثال تُرسم بكود صفحة الزائر نفسه (index.html) داخل إطار مخفي، فتطابق ما يراه الزائر تمامًا.
     وبيت اللعبة يُؤخذ من بيانات game.html نفسها (بلا تشكيل كما في اللعبة)، فإن عُدّل البيت أو استُبعد تبعه الملصق. -->

button:hover { border-color: #EB5A33; }

<body>
<section id="name" aria-labelledby="name-h">
  <h2 id="name-h">من اسمه نصيب</h2>
  <div class="row">
    <button type="button" data-dl="name-screen">تنزيل شريحة الشاشة (16:9)</button>
    <button type="button" data-dl="name-print">تنزيل ملصق الطباعة (A4)</button>
  </div>
  <canvas id="name-screen" aria-label="شريحة الشاشة: من اسمه نصيب"></canvas>
  <canvas id="name-print" aria-label="ملصق الطباعة A4: من اسمه نصيب"></canvas>
</section>
<section id="game" aria-labelledby="game-h">
  <h2 id="game-h">شاعر أم آلة؟</h2>
  <div class="row">
    <button type="button" data-dl="game-screen">تنزيل شريحة الشاشة (16:9)</button>
    <button type="button" data-dl="game-print">تنزيل ملصق الطباعة (A4)</button>
  </div>
  <canvas id="game-screen" aria-label="شريحة الشاشة: شاعر أم آلة؟"></canvas>
  <canvas id="game-print" aria-label="ملصق الطباعة A4: شاعر أم آلة؟"></canvas>
</section>
<script>
// ملصقات الموقع: لكل تجربة شريحة للشاشة (1920×1080 بمقياس 2) وملصق طباعة A4 (1240×1754 بمقياس 2 = 300 نقطة/بوصة)
const SITE = 'dsc-name-quote.vercel.app';
const UI = "'IBM Plex Sans Arabic', system-ui, sans-serif";
const MONO = "'JetBrains Mono', ui-monospace, monospace";
const CAL = "'Gulzar', 'IBM Plex Sans Arabic', serif";
const AMIRI = "'Amiri', serif";
const C = { ink: '#111111', cream: '#FAF7F2', sand: '#D8CFC0', muted: '#6B6B6B', line: '#E3E3E3', ember: '#EB5A33', teal: '#127868', white: '#FFFFFF' };
const LABEL = 'DSC · ARABIC LANGUAGE DAY · 25 NOV 2026';
const AR_DIGITS = ['١', '٢', '٣'];
const QR_NOTE = 'يعمل على أي جوال، بلا تطبيق';
const CLUB = 'نادي علوم البيانات', UNI = 'جامعة اليمامة';
// بيت الآلة الذي يظهر في ملصق اللعبة (من data/machine.csv). لا يُكشف مصدره في الملصق.
const GAME_VERSE = 'm01';

const POSTERS = {
  name: {
    title: 'من اسمه نصيب', titleFont: CAL, titleWeight: 400,
    lede: 'اكتب اسمك، ونخبرك بمعناه وجذره، ونختار له بيتًا من الشعر العربي في بطاقة تحفظها.',
    steps: ['امسح الرمز بكاميرا جوالك', 'اكتب اسمك الأول', 'احفظ بطاقتك وشاركها'],
    site: SITE, caption: 'مثال لبطاقة من الموقع', qr: 'qr.svg',
    files: { screen: 'dsc-poster-screen-16x9.png', print: 'dsc-poster-a4.png' },
  },
  game: {
    title: 'شاعر أم آلة؟', titleFont: AMIRI, titleWeight: 700,
    lede: 'عشرة أبيات: بعضها لشعراء عرب عبر العصور، وبعضها كتبه نموذج ذكاء اصطناعي. هل تميّز بينها؟',
    steps: ['امسح الرمز بكاميرا جوالك', 'اختر لكل بيت: شاعر أم آلة', 'احفظ نتيجتك وشاركها'],
    site: SITE + '/game.html', caption: 'جولة من اللعبة', qr: 'game-qr.svg',
    files: { screen: 'dsc-game-poster-screen-16x9.png', print: 'dsc-game-poster-a4.png' },
  },
};

// شعار النادي الرسمي (icon-ink.svg)
const MB = { x: 98.84, y: 20.15, w: 114.63, h: 140.61 };
const MARK = new Path2D('M' + '175.57,76.08 175.57,48.12 137.68,48.12 137.68,20.15 98.84,20.15 98.84,48.52 136.74,48.52 136.74,76.49 174.64,76.49 174.64,104.42 136.74,104.42 136.74,132.39 98.84,132.39 98.84,160.76 137.68,160.76 137.68,132.79 175.57,132.79 175.57,104.83 213.47,104.83 213.47,104.46 213.47,76.46 213.47,76.08'.split(' ').join(' L') + ' Z');
function drawMark(ctx, x, y, h, color) {
  const s = h / MB.h;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.translate(-MB.x, -MB.y);
  ctx.fillStyle = color; ctx.fill(MARK); ctx.restore();
  return MB.w * s;
}
function text(ctx, font, color, align = 'center', dir = 'rtl') { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.direction = dir; }
function wrap(ctx, str, maxW) {
  const lines = []; let line = '';
  for (const w of str.split(/\s+/)) { const t = line ? `${line} ${w}` : w; if (!line || ctx.measureText(t).width <= maxW) line = t; else { lines.push(line); line = w; } }
  if (line) lines.push(line); return lines;
}
// مثل wrap بعدد الأسطر نفسه، لكن بأسطر متقاربة الطول (فلا تبقى كلمة وحيدة في السطر الأخير)
function balance(ctx, str, maxW) {
  const n = wrap(ctx, str, maxW).length;
  let lo = maxW / n, hi = maxW;
  while (hi - lo > 4) { const mid = (lo + hi) / 2; if (wrap(ctx, str, mid).length > n) lo = mid; else hi = mid; }
  return wrap(ctx, str, hi);
}
function trackedWidth(ctx, str, sp) { let w = 0; for (const ch of str) w += ctx.measureText(ch).width + sp; return w - sp; }
function tracked(ctx, str, x, y, sp) { ctx.textAlign = 'left'; ctx.direction = 'ltr'; for (const ch of str) { ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + sp; } }
function grid(ctx, W, H, step, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let x = step; x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = step; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}
function roundRect(ctx, x, y, w, h, r, fill) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
// أكبر حجم (حتى start) يتسع فيه النص لـ maxW
function fitFont(ctx, str, family, weight, start, maxW) {
  let s = start; ctx.font = `${weight} ${s}px ${family}`;
  const w = ctx.measureText(str).width; if (w > maxW) s = Math.floor(s * maxW / w);
  return s;
}
// الرابط بخط أحادي متباعد، يصغر إن ضاق مكانه
function site(ctx, str, x, y, start, color, maxW) {
  let s = start; ctx.font = `500 ${s}px ${MONO}`;
  const w = trackedWidth(ctx, str, 1); if (w > maxW) { s = Math.floor(s * maxW / w); ctx.font = `500 ${s}px ${MONO}`; }
  ctx.fillStyle = color; tracked(ctx, str, x, y, 1);
}
function card(ctx, im, x, y, w, shadow) {
  const h = w * 16 / 9;
  ctx.save();
  if (shadow) { ctx.shadowColor = 'rgba(17,17,17,.18)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14; }
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.fillStyle = C.cream; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.clip(); ctx.drawImage(im, x, y, w, h); ctx.restore();
  return h;
}
// التذييل: الشعار واسم النادي يمينًا، والرابط يسارًا في ما بقي من المكان
function footer(ctx, P, { L, R, y, mh, big, small, url, color, sub }) {
  const mw = drawMark(ctx, R - MB.w * mh / MB.h, y, mh, color);
  text(ctx, `700 ${big}px ${UI}`, color, 'right'); ctx.fillText(CLUB, R - mw - 22, y + mh * 0.58);
  const clubW = ctx.measureText(CLUB).width;
  text(ctx, `400 ${small}px ${UI}`, sub, 'right'); ctx.fillText(UNI, R - mw - 22, y + mh * 1.2);
  const left = R - mw - 22 - Math.max(clubW, ctx.measureText(UNI).width);
  site(ctx, P.site, L, y + mh * 0.88, url, sub === C.sand ? C.sand : C.ink, left - L - 56);
}

// ---------- شريحة الشاشة 16:9 (أرضية حبرية تناسب قاعة مظلمة) ----------
function drawScreen(cv, P, qr, sample) {
  const W = 1920, H = 1080, S = 2;
  cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d'); ctx.scale(S, S); ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  grid(ctx, W, H, 60, 'rgba(255,255,255,.035)');
  ctx.fillStyle = C.ember; ctx.fillRect(0, 0, W, 10);

  // العمود الأيمن: الوسم والعنوان والتعريف والخطوات
  const R = W - 104, colW = 600;
  ctx.font = `500 22px ${MONO}`; ctx.fillStyle = C.ember;
  tracked(ctx, LABEL, R - trackedWidth(ctx, LABEL, 2.6), 196, 2.6);
  const ts = fitFont(ctx, P.title, P.titleFont, P.titleWeight, 190, colW);
  text(ctx, `${P.titleWeight} ${ts}px ${P.titleFont}`, C.white, 'right');
  const m = ctx.measureText(P.title); // موسَّط عموديًا حول 330
  ctx.fillText(P.title, R, 330 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2);
  text(ctx, `400 34px ${UI}`, C.sand, 'right');
  const lede = balance(ctx, P.lede, colW);
  lede.forEach((l, i) => ctx.fillText(l, R, 478 + i * 56));
  let y = 478 + lede.length * 56 + 70;
  P.steps.forEach((s, i) => {
    text(ctx, `700 40px ${UI}`, C.ember, 'right'); ctx.fillText(AR_DIGITS[i], R, y);
    const fs = fitFont(ctx, s, UI, 500, 38, colW - 54);
    text(ctx, `500 ${fs}px ${UI}`, C.white, 'right'); ctx.fillText(s, R - 54, y);
    y += 74;
  });

  // الرمز: لوحة بيضاء كبيرة في الوسط (الرمز نفسه فيه هامشه الأبيض)
  const Q = 600, qx = 520, qy = 196;
  roundRect(ctx, qx, qy, Q, Q, 14, C.white);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(qr, qx, qy, Q, Q);
  ctx.imageSmoothingEnabled = true;
  text(ctx, `500 32px ${UI}`, C.white); ctx.fillText(QR_NOTE, qx + Q / 2, qy + Q + 64);

  // مثال حقيقي من الموقع
  const cw = 340, cy0 = qy + (Q - cw * 16 / 9) / 2;
  card(ctx, sample, 104, cy0 + 4, cw, false);
  text(ctx, `400 24px ${UI}`, C.sand); ctx.fillText(P.caption, 104 + cw / 2, cy0 + cw * 16 / 9 + 50);

  // التذييل
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(104, H - 140, W - 208, 1.5);
  footer(ctx, P, { L: 104, R, y: H - 102, mh: 52, big: 30, small: 24, url: 30, color: C.white, sub: C.sand });
}

// ---------- ملصق الطباعة A4 (أرضية كريمية) ----------
function drawPrint(cv, P, qr, sample) {
  const W = 1240, H = 1754, S = 2;
  cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d'); ctx.scale(S, S); ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  grid(ctx, W, H, 62, 'rgba(17,17,17,.045)');
  ctx.fillStyle = C.ember; ctx.fillRect(0, 0, W, 16);
  const M = 96;

  ctx.font = `500 22px ${MONO}`; ctx.fillStyle = C.ember;
  tracked(ctx, LABEL, (W - trackedWidth(ctx, LABEL, 2.6)) / 2, 150, 2.6);
  // العنوان: نقيس حدوده الفعلية (النستعليق ينزل كثيرًا تحت السطر) ونبدأ ما بعده من أسفله
  const ts = fitFont(ctx, P.title, P.titleFont, P.titleWeight, 210, W - 2 * M);
  text(ctx, `${P.titleWeight} ${ts}px ${P.titleFont}`, C.ink);
  const tm = ctx.measureText(P.title);
  const tTop = 196, tBase = tTop + tm.actualBoundingBoxAscent;
  ctx.fillText(P.title, W / 2, tBase);
  const tBottom = tBase + tm.actualBoundingBoxDescent;
  text(ctx, `400 36px ${UI}`, C.muted);
  const lede = balance(ctx, P.lede, 860);
  const l0 = tBottom + 76;
  lede.forEach((l, i) => ctx.fillText(l, W / 2, l0 + i * 58));

  // الرمز يمينًا والمثال يسارًا. حجمه يتكيف حتى تتسع الخطوات فوق التذييل.
  const qy = l0 + (lede.length - 1) * 58 + 56;
  const Q = Math.min(600, Math.max(480, (H - 190) - qy - 330)), qx = W - M - Q;
  roundRect(ctx, qx, qy, Q, Q, 14, C.white);
  ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(qx, qy, Q, Q, 14); ctx.stroke();
  ctx.imageSmoothingEnabled = false; ctx.drawImage(qr, qx, qy, Q, Q); ctx.imageSmoothingEnabled = true;
  text(ctx, `500 34px ${UI}`, C.ink); ctx.fillText(QR_NOTE, qx + Q / 2, qy + Q + 62);

  const chh = Q, cw = chh * 9 / 16, cx = M + 30, cy = qy;
  card(ctx, sample, cx, cy, cw, true);
  text(ctx, `400 24px ${UI}`, C.muted); ctx.fillText(P.caption, cx + cw / 2, cy + chh + 50);

  // الخطوات أفقيًا، تبدأ من اليمين، يفصلها عمّا فوقها خط جمري قصير في الوسط
  const div = qy + Q + 120, sy = div + 104, colW = (W - 2 * M) / 3;
  ctx.fillStyle = C.ember; ctx.fillRect(W / 2 - 60, div, 120, 6);
  P.steps.forEach((s, i) => {
    const cxs = W - M - colW * i - colW / 2;
    text(ctx, `700 52px ${UI}`, C.ember); ctx.fillText(AR_DIGITS[i], cxs, sy);
    const fs = fitFont(ctx, s, UI, 500, 30, colW - 24);
    text(ctx, `500 ${fs}px ${UI}`, C.ink); ctx.fillText(s, cxs, sy + 56);
  });

  // التذييل
  ctx.fillStyle = C.line; ctx.fillRect(M, H - 170, W - 2 * M, 2);
  footer(ctx, P, { L: M, R: W - M, y: H - 132, mh: 64, big: 32, small: 26, url: 28, color: C.ink, sub: C.muted });
}

// ---------- شاشة جولة من «شاعر أم آلة؟» كما تبدو على الجوال (9:16) ----------
// تحاكي ui/game.html في الوضع الفاتح: الجولة الثالثة، الأولى صحيحة والثانية خاطئة
function gameShot(v) {
  const W = 432, H = 768, S = 3, L = 20, R = W - 20, cw = W - 40;
  const cv = document.createElement('canvas'); cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d'); ctx.scale(S, S); ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.ember; ctx.fillRect(0, 0, W, 4);

  const lab = 'DSC · ARABIC LANGUAGE DAY';
  ctx.font = `500 11px ${MONO}`; ctx.fillStyle = C.ember;
  tracked(ctx, lab, R - trackedWidth(ctx, lab, 1.3), 42, 1.3);
  text(ctx, `700 34px ${UI}`, C.ink, 'right'); ctx.fillText('شاعر أم آلة؟', R, 92);
  text(ctx, `400 15px ${UI}`, C.muted, 'right');
  const lede = wrap(ctx, POSTERS.game.lede, cw);
  lede.forEach((l, i) => ctx.fillText(l, R, 126 + i * 25));

  // شريط التقدم: مربعات النادي
  const py = 126 + (lede.length - 1) * 25 + 34, gap = 6, sq = (cw - gap * 9) / 10;
  const states = [C.teal, C.ember, C.ink];
  for (let k = 0; k < 10; k++) { ctx.fillStyle = states[k] ?? C.line; ctx.fillRect(R - sq - k * (sq + gap), py, sq, 10); }
  text(ctx, `400 14px ${UI}`, C.muted, 'right'); ctx.fillText('البيت ٣ من ١٠', R, py + 36);

  // بطاقة البيت
  const vy = py + 60, vh = 260;
  ctx.save(); ctx.shadowColor = 'rgba(17,17,17,.10)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
  roundRect(ctx, L, vy, cw, vh, 12, C.cream); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.roundRect(L, vy, cw, vh, 12); ctx.clip();
  ctx.translate(L, vy); grid(ctx, cw, vh, 32, 'rgba(17,17,17,.045)');
  ctx.fillStyle = C.ember; ctx.fillRect(0, 0, cw, 4); ctx.restore();
  const fs = Math.min(fitFont(ctx, v.first, AMIRI, 400, 29, cw - 44), fitFont(ctx, v.second, AMIRI, 400, 29, cw - 44));
  text(ctx, `400 ${fs}px ${AMIRI}`, C.ink);
  const lh = fs * 1.9, mid = vy + 2 + vh / 2;
  ctx.fillText(v.first, W / 2, mid - lh / 2 + fs * 0.35);
  ctx.fillText(v.second, W / 2, mid + lh / 2 + fs * 0.35);

  // الخياران
  const by = vy + vh + 20, bh = 66, bw = (cw - 10) / 2;
  [['شاعر', R - bw], ['آلة', L]].forEach(([t, x]) => {
    roundRect(ctx, x, by, bw, bh, 8, C.white);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x + 1, by + 1, bw - 2, bh - 2, 8); ctx.stroke();
    text(ctx, `700 22px ${UI}`, C.ink); ctx.fillText(t, x + bw / 2, by + bh / 2 + 8);
  });

  ctx.fillStyle = C.line; ctx.fillRect(L, H - 64, cw, 1);
  text(ctx, `400 13px ${UI}`, C.muted, 'right'); ctx.fillText('نادي علوم البيانات · جامعة اليمامة · اليوم العالمي للغة العربية', R, H - 34);
  return cv;
}

function load(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(src)); i.src = src; }); }
// يحمّل صفحة من الموقع في إطار مخفي ويعيد نافذتها
async function frame(src) {
  const f = document.createElement('iframe');
  f.src = src;
  f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
  f.style.cssText = 'position:absolute;left:-9999px;width:420px;height:800px;border:0';
  document.body.appendChild(f);
  await new Promise((r) => { f.onload = r; });
  return f.contentWindow;
}

// بطاقة حقيقية: نستدعي محرك صفحة الزائر ودالة رسمها
async function sampleCard(name = 'نورة', style = 'nastaliq') {
  const w = await frame('index.html');
  const E = w.eval('E'), themeLabel = w.eval('themeLabel');
  const r = E.resolve(name);
  const q = E.quoteFor(r);
  const sub = [r.root && r.source !== 'root' ? `الجذر ${r.root}` : null, themeLabel(r.themes[0])].filter(Boolean).join(' · ');
  const shown = w.displayName(r);
  await w.loadFonts(style, shown, q.first + q.second);
  const cv = w.document.createElement('canvas'); // تُرسم بخطوط الإطار نفسه (Amiri وGulzar)
  w.drawCard(cv, { name: shown, style, meaning: r.meaning, sub, quote: q });
  return cv;
}

// بيت اللعبة: من بيانات game.html نفسها، بلا تشكيل كما يراه اللاعب
async function gameSample() {
  const w = await frame('game.html');
  const pool = w.eval('POOL');
  const v = pool.find((x) => x.id === GAME_VERSE) ?? pool.find((x) => x.kind === 'machine');
  await document.fonts.load(`400 29px 'Amiri'`, v.first + v.second);
  return gameShot(v);
}

const fontsReady = Promise.all([
  document.fonts.load(`400 100px 'Gulzar'`, POSTERS.name.title),
  document.fonts.load(`700 100px 'Amiri'`, POSTERS.game.title),
  ...[400, 500, 700].map((w) => document.fonts.load(`${w} 40px 'IBM Plex Sans Arabic'`,
    Object.values(POSTERS).map((P) => P.lede + P.steps.join(' ') + P.caption).join(' ') + CLUB + UNI + QR_NOTE + '١٢٣ من شاعر آلة')),
  document.fonts.load(`500 22px 'JetBrains Mono'`, LABEL + POSTERS.game.site),
]);

const ready = {};
for (const [key, sample] of [['name', sampleCard], ['game', gameSample]]) {
  const P = POSTERS[key];
  ready[key] = (async () => {
    await fontsReady;
    const [qr, im] = await Promise.all([load(P.qr), sample()]);
    drawScreen(document.getElementById(`${key}-screen`), P, qr, im);
    drawPrint(document.getElementById(`${key}-print`), P, qr, im);
  })();
  ready[key].catch((e) => {
    const p = document.createElement('p'); p.className = 'err'; p.textContent = `تعذّر رسم الملصق: ${e.message}`;
    document.getElementById(key).append(p);
  });
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-dl]'); if (!b) return;
  const [key, kind] = b.dataset.dl.split('-');
  await ready[key];
  document.getElementById(b.dataset.dl).toBlob((blob) => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = POSTERS[key].files[kind]; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }, 'image/png');
});
</script>
</body>
</html>
